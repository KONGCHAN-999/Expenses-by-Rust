[workspace]
members = ["core"]
resolver = "3"

[package]
name = "expenses-app"
version = "0.1.0"
edition = "2024"
description = "Offline income/expense tracker (Lao language, kip) built with Leptos (CSR)."

[dependencies]
expenses-core = { path = "core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Storage",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Window",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
