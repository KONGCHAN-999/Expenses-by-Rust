<!DOCTYPE html>
<html lang="lo">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
    <title>ລາຍຮັບ-ລາຍຈ່າຍ</title>

    <!--
      PWA: add your manifest, apple-touch-icon and service-worker registration here.
      Asset paths are relative (Trunk.toml sets public_url = "./"), so the app
      also works from a GitHub Pages sub-folder such as /<repo-name>/.
    -->

    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <script>
      // Saves a file. On phones it opens the share sheet (iOS: "Save to Files");
      // elsewhere it downloads. Resolves to "shared", "downloaded" or "cancelled".
      window.kipSaveFile = async function (name, mime, content) {
        const file = new File([content], name, { type: mime });
        const touch = window.matchMedia("(pointer: coarse)").matches;
        if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return "shared";
          } catch (e) {
            if (e && e.name === "AbortError") return "cancelled";
            // Otherwise fall back to a normal download below.
          }
        }
        const url = URL.createObjectURL(file);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        return "downloaded";
      };
    </script>
  </head>
  <body></body>
</html>
